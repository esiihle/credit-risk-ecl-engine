# CI for the credit risk ECL engine.
#
# Two jobs on every push and pull request:
#   * the test suite, on Python 3.11 and 3.12, so a version-specific break is
#     visible rather than masked
#   * a full pipeline run against the committed sample book, because unit tests
#     can all pass while the stages no longer fit together
#
# The badge in the README points here. A badge is a claim about the project;
# this file is what makes the claim true.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # report every failing version, not just the first
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: pytest -v --durations=10

      - name: Run the pipeline against the committed sample
        run: python scripts/run_pipeline.py --sample

      - name: Rebuild a small book end to end
        run: python scripts/generate_book.py --accounts 500 --database /tmp/ci.duckdb
